expname: siren_diffusion
hydra:
  run:
    dir: logs/${expname}/${now:%Y-%m-%d_%H-%M-%S}
rand_seed: 0
method: hyper_3d
calculate_metric_on_test: True
dedup: False
test_sample_mult: 1.1
filter_bad: True
filter_bad_path: ./data/plane_problematic_shapes.txt
disable_wandb: True
dataset_dir: ./data
dataset: 02691156
tensorboard_log_dir: .
augment: False
augment_amount: 0
jitter_augment: False
normalization_factor: 1
timesteps: 500
epochs: 7000
model_ckpt_freq: 8000
validation_freq: 500
# epochs: 2000
scheduler: True
scheduler_step: 200
best_model_save_path:
mode: train
siren_path: /home/kctung/Projects/BlockFusion/logs/SIREN_overfitting_mechhand/20260102-184949/pure_siren_model_permuted.pt
# run_dir: # only need for ckpt generated before refactoring log organization
# mlps_folder_train: ./mlp_weights/3d_128_plane_multires_4_manifoldplus_slower_no_clipgrad
mlps_folder_train: ../instant-vnr-pytorch/logs/hyperinr/debug/run00028
model_resume_path:
sampling: ddpm
lr: 0.0002
batch_size: 256
accumulate_grad_batches: 1
standardize: False
val:
  num_points: 2048
  num_samples: 60
mlp_config:
  params:
    model_type: mlp_3d
    out_size: 1
    hidden_neurons:
      - 128
      - 128
      - 128
    output_type: occ
    out_act: sigmoid
    multires: 4
    use_leaky_relu: False
    move: False
diff_config:
  params:
    model_mean_type: START_X
    model_var_type: FIXED_LARGE
    loss_type: MSE
transformer_config:
  params:
    n_embd: 1440
    # n_embd: 720
    n_layer: 12
    n_head: 16
    split_policy: layer_by_layer
    use_global_residual: False
    condition: 'no'
